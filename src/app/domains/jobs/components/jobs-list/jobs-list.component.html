<div class="flex flex-col gap-3 overflow-auto h-full rounded-2xl">

  @if (vm$ | async; as vm) {

    <div class="bg-white rounded-xl shadow-sm p-3">
      <div class="flex items-center justify-between gap-3">
        <button
          (click)="previousPage()"
          class="w-7 h-7 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 cursor-pointer text-gray-500 hover:text-gray-700 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <span class="text-xs text-gray-600 font-medium">
            Page {{currentPage()}} of {{vm.numberOfPages}}
          </span>

        <button
          (click)="nextPage()"
          class="w-7 h-7 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 cursor-pointer text-gray-700 hover:text-gray-900 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    @if (vm.loading) {
      @for (item of [1, 2, 3]; track item) {
        <app-jobs-item-skeleton></app-jobs-item-skeleton>
      }
    } @else {
      @for (job of vm.jobs; track job.id) {
        <app-job-item
          [job]="job"
          (click)="setSelectedJob(job)">
        </app-job-item>
      }
    }

  }

</div>
