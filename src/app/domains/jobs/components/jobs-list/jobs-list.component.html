<div class="flex flex-col gap-3 overflow-auto h-full rounded-2xl">
  @if (vm$ | async; as vm) {

  <div class="bg-white rounded-xl shadow-sm p-3">
    <div class="flex items-center justify-between gap-3">
      <button (click)="previousPage()"
        class="w-7 h-7 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 cursor-pointer text-gray-500 hover:text-gray-700 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <span class="text-xs text-gray-600 font-medium">
        Page {{ currentPage() }} of {{ vm.numberOfPages }}
      </span>

      <button (click)="nextPage()"
        class="w-7 h-7 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 cursor-pointer text-gray-700 hover:text-gray-900 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>

  @if (vm.loading) {
  @for (item of [1, 2]; track item) {
  <app-jobs-item-skeleton></app-jobs-item-skeleton>
  <app-jobs-item-skeleton></app-jobs-item-skeleton>
  <app-jobs-item-skeleton></app-jobs-item-skeleton>
  }
  } @else {
  @if (vm.searchResultCount == 0) {
  <div
    class="flex-1 flex flex-col items-center justify-center gap-7 px-8 py-12 bg-white overflow-hidden relative rounded-3xl">

    <div class="absolute top-12 right-20 w-72 h-72 rounded-full bg-violet-100 opacity-50 blur-3xl animate-pulse"></div>
    <div class="absolute bottom-16 left-12 w-56 h-56 rounded-full bg-indigo-100 opacity-40 blur-3xl animate-pulse"
      style="animation-delay:1.2s"></div>

    <div class="relative flex items-center justify-center w-36 h-36">
      <span class="absolute w-36 h-36 rounded-full bg-violet-200 opacity-40 animate-ping"
        style="animation-duration:2.8s"></span>
      <div class="absolute w-28 h-28 rounded-full border-2 border-dashed border-violet-300 animate-spin"
        style="animation-duration:16s"></div>
      <div
        class="relative w-20 h-20 rounded-full bg-white shadow-xl border border-violet-100 flex items-center justify-center animate-bounce"
        style="animation-duration:3.2s">
        <svg class="w-9 h-9 text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M20.25 14.15v4.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6A2.25 2.25 0 0 1 6 3.75h5.25" />
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16.5 3.75a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m15 5.25 1.5 1.5 2.25-2.25" />
        </svg>
        <span
          class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-rose-500 flex items-center justify-center shadow-md animate-bounce"
          style="animation-duration:2s;animation-delay:0.4s">
          <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </span>
      </div>
    </div>

    <div class="text-center flex flex-col items-center gap-2 relative z-10">
      <h2 class="text-2xl font-bold text-gray-800 tracking-tight">No job offers found</h2>
    </div>
  </div>
  } @else {
  @for (job of vm.jobs; track job.id) {
  <app-job-item [job]="job" [isFavorited]="isFavorited(job.id)" [favoriteId]="getFavoriteId(job.id)"
    (click)="setSelectedJob(job)">
  </app-job-item>
  }
  }

  }

  }

</div>
