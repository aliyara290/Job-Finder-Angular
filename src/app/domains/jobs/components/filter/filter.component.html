<div class="py-3 bg-white shadow-sm relative z-1">
  <div class="flex gap-6 items-center max-w-7xl mx-auto">

    <div class="flex items-center gap-4  ">

      <div>
        <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 0 16 16" fill="none">
          <path d="M0 3H16V1H0V3Z" fill="#230939"/>
          <path d="M2 7H14V5H2V7Z" fill="#230939"/>
          <path d="M4 11H12V9H4V11Z" fill="#230939"/>
          <path d="M10 15H6V13H10V15Z" fill="#230939"/>
        </svg>
      </div>
      <div class="relative">
        <select (change)="onSortChange($event)"
                class="appearance-none bg-white border border-gray-300 rounded-md px-4 py-2.5 pr-10 text-gray-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent cursor-pointer hover:bg-gray-50 transition">
          <option value="" selected>Employment Type</option>
          <option value="1">Full-time</option>
          <option value="2">Part-time</option>
          <option value="3">Shift Work</option>
          <option value="4">Intermittent</option>
          <option value="5">Job Sharing</option>
          <option value="6">Multiple Schedules</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>

      <div class="relative">
        <select (change)="onDateChange($event)"
                class="appearance-none bg-white border border-gray-300 rounded-md px-4 py-2.5 pr-10 text-gray-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent cursor-pointer hover:bg-gray-50 transition">
          <option value="" selected>All Dates</option>
          <option value="1">Last 24 hours</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="60">Last 60 days</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>

    </div>
  </div>
</div>
