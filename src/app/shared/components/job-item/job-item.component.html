<div
  class="bg-white rounded-3xl shadow-lg p-5 hover:shadow-xl border border-transparent hover:border-purple-400 transition-shadow duration-300 cursor-pointer">
  <div class="flex items-start justify-between mb-4">
    <div class="w-10 h-10 bg-purple-200 rounded-xl flex items-center justify-center">
      <span class="text-xl font-bold text-gray-800">{{job.company?.charAt(0) || 'J'}}</span>
    </div>
    <button (click)="toggleFavorite($event)"
      class="w-10 h-10 flex items-center justify-center hover:bg-purple-100 cursor-pointer rounded-full transition-colors duration-200"
      [title]="isFavorited ? 'Remove from favorites' : 'Add to favorites'">
      <svg class="w-6 h-6 transition-colors duration-200" [class.text-purple-600]="isFavorited"
        [class.text-purple-400]="!isFavorited" [attr.fill]="isFavorited ? 'currentColor' : 'none'" stroke="currentColor"
        stroke-width="2" viewBox="0 0 24 24">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
    </button>
  </div>
  <h3 class="text-lg font-bold text-gray-900 mb-1">{{job.title}}</h3>
  <p class="text-sm text-gray-600 font-medium mb-2">{{job.company}}</p>
  <div class="flex items-center gap-2 text-gray-500 text-sm mb-4 flex-wrap">
    <span>{{job.location}}</span>
    <span class="text-gray-400">•</span>
    <span class="font-semibold text-gray-700">{{job.employmentType}}</span>
  </div>
  <div class="flex items-center gap-2 text-gray-900 text-xs mb-4 flex-wrap">
    <div class="px-2 py-1 bg-purple-200 rounded-md">
      <strong>${{ job.salaryMin | number:'1.0-0' }}</strong> ~
      <strong>${{ job.salaryMax | number:'1.0-0' }}</strong>
      {{ job.salaryInterval }}
    </div>
  </div>
  <button
    class="w-full bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white font-semibold text-base py-2 px-6 rounded-xl transition-all duration-300 cursor-pointer shadow-md flex items-center justify-center gap-2">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M13 10V3L4 14h7v7l9-11h-7z" />
    </svg>
    Apply
  </button>
</div>
