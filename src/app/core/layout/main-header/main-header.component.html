<header class="w-full h-17 flex items-center justify-center bg-white shadow-sm">
  <div class="w-full px-30 flex items-center justify-between">
    <h2 class="text-2xl font-bold text-purple-600">Finder <span class="text-xl font-light">®</span></h2>

    <div class="flex items-center gap-3">
      @if (!(isAuthenticated$ | async)) {
        <a [routerLink]="['/auth/register']">
          <button
            class="px-6 py-2 bg-purple-600 text-white font-medium rounded-lg hover:bg-purple-700 transition-colors cursor-pointer">
            Sign up
          </button>
        </a>

        <a [routerLink]="['/auth/login']">
          <button
            class="px-6 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">
            Log in
          </button>
        </a>
      } @else {
        <div>
          <ul class="flex items-center gap-3">
            <li class="cursor-pointer">
              <a [routerLink]="['/account/favorites']">
                <svg class="w-7 text-purple-900 group-hover:text-purple-900 transition-colors duration-300" fill="none"
                     stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </a>
            </li>
            <li class="cursor-pointer">
              <a [routerLink]="['/account/profile']">
                <svg class="w-8 text-purple-900 group-hover:text-purple-900 transition-colors duration-300" fill="none"
                     stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </a>
            </li>
            <li (click)="logout()" class="cursor-pointer">
              <svg class="w-8 text-red-500 hover:text-red-900 transition-colors duration-300" fill="none"
                   stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
              </svg>
            </li>
          </ul>
        </div>
      }
    </div>
  </div>
</header>
