<header class="sticky top-0 z-50 w-full h-24 flex items-center justify-center bg-[#230939] shadow-sm">
  <div class="w-full px-30 flex items-center justify-between">
    <div>
      <a [routerLink]="['/']" class="cursor-pointer">
        <h2 class="text-2xl font-bold text-white">Finder <span class="text-xl text-purple-400  font-light">®</span></h2>
      </a>
    </div>

    @if (isSearchPage()) {
    <div class="bg-white rounded-full shadow-xl p-1 px-2 flex items-center gap-2 w-full max-w-3xl">
      <input type="text" placeholder="Search jobs, keywords, companies"
        class="flex-1 px-4 py-2 text-gray-700 focus:outline-none" (input)="onKeywordChange($event)" />

      <div class="w-px h-10 bg-gray-300"></div>

      <input type="text" placeholder='Enter location or "remote"'
        class="flex-1 px-4 py-3 text-gray-700 focus:outline-none" (input)="onLocationChange($event)" />

      <button (click)="search()"
        class="bg-[#230939] text-white p-2 rounded-full hover:bg-[#430b71] transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>
    </div>
    }

    <div class="flex items-center gap-3">
      @if (!(isAuthenticated$ | async)) {
      <a [routerLink]="['/auth/register']">
        <button
          class="px-6 py-2 bg-white text-[#430b71] font-medium border hover:border-gray-300 rounded-lg hover:bg-transparent hover:text-white transition-colors cursor-pointer">
          Sign up
        </button>
      </a>
      <a [routerLink]="['/auth/login']">
        <button
          class="px-6 py-2 border border-gray-300 text-white font-medium rounded-lg hover:bg-white hover:text-[#430b71] transition-colors cursor-pointer">
          Log in
        </button>
      </a>
      } @else {
      <div>
        <ul class="flex items-center gap-3">
          <li class="cursor-pointer" routerLinkActive="hidden" [routerLinkActiveOptions]="{ exact: true, queryParams: 'subset' }
              ">
            <a [routerLink]="['/w/jobs/search']">
              <svg class="w-8 pt-[2px] text-white hover:stroke-purple-600 transition-colors duration-300" fill="none"
                stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18v13H3z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V5a4 4 0 018 0v2" />
              </svg>
            </a>
          </li>
          <li class="cursor-pointer">
            <a [routerLink]="['/w/account/favorites']" class="relative ">
              <svg class="w-7 text-white hover:stroke-purple-400 transition-colors duration-300" fill="none"
                stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
              @let count = (favoritesCount$ | async) ?? 0;
              @if (count > 0) {
              <span
                class="absolute -top-2 -right-2.5 min-w-[18px] h-[18px] bg-purple-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1 shadow-md">
                {{ count > 99 ? '99+' : count }}
              </span>
              }
            </a>
          </li>
          <li class="cursor-pointer">
            <a [routerLink]="['/w/account/applications']" class="relative">
              <svg class="w-7 text-white hover:stroke-purple-400 transition-colors duration-300" fill="none"
                stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6m-6 4h6" />
              </svg>
            </a>
          </li>
          <li class="cursor-pointer">
            <a [routerLink]="['/w/account/profile']">
              <svg class="w-8 text-white hover:stroke-purple-600  transition-colors duration-300" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </a>
          </li>
          <li (click)="logout()" class="cursor-pointer">
            <svg class="w-8 text-white hover:text-red-400 transition-colors duration-300" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
          </li>
        </ul>
      </div>
      }
    </div>
  </div>
</header>
